        <button onclick="initGame()" class="w-full max-w-xs py-4 bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 active:scale-95 text-slate-950 font-black rounded-2xl shadow-lg transition text-base">
          CHƠI NGAY <i class="fas fa-play ml-1"></i>
        </button>
      </div>
    </div>

        <i class="fas fa-anchor"></i> THẢ MÓC CÂU
      </button>
    </div>

  </div>
