<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Nề Nếp - THPT Quang Trung</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">

  <!-- Khung chuẩn Mobile-First ở giữa màn hình -->
  <div class="max-w-md mx-auto min-h-screen bg-white shadow-lg flex flex-col justify-between">
    
    <!-- Phần 1: Thanh tiêu đề trên cùng (Header) -->
    <header class="bg-blue-700 text-white p-4 rounded-b-2xl shadow-md">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-xs text-blue-200 uppercase font-semibold tracking-wider">Đoàn Trường THPT Quang Trung</p>
          <h1 class="text-lg font-bold mt-0.5">Hệ Thống Quản Lý Thi Đua</h1>
        </div>
        <span class="bg-blue-600 text-xs px-2.5 py-1 rounded-full border border-blue-400">
          2026 - 2027
        </span>
      </div>
    </header>

    <!-- Phần 2: Nội dung chính - Chọn vai trò đăng nhập -->
    <main class="p-5 flex-1 flex flex-col justify-center">
      <div class="text-center mb-6">
        <h2 class="text-xl font-bold text-slate-800">Đăng nhập hệ thống</h2>
        <p class="text-sm text-slate-500 mt-1">Chọn vai trò của bạn để tiếp tục</p>
      </div>

      <!-- 4 Nút phân quyền theo đúng kế hoạch -->
      <div class="space-y-3">
        <!-- Vai trò 1: Cờ đỏ -->
        <button class="w-full flex items-center justify-between p-4 bg-red-50 hover:bg-red-100 border border-red-200 rounded-xl transition">
          <div class="text-left">
            <p class="font-bold text-red-700">Đội Cờ Đỏ / Xung Kích</p>
            <p class="text-xs text-red-500">Ghi nhận vi phạm & chụp ảnh minh chứng</p>
          </div>
          <span class="text-red-600 font-bold">→</span>
        </button>

        <!-- Vai trò 2: GVCN -->
        <button class="w-full flex items-center justify-between p-4 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-xl transition">
          <div class="text-left">
            <p class="font-bold text-emerald-700">Giáo Viên Chủ Nhiệm</p>
            <p class="text-xs text-emerald-600">Theo dõi điểm lớp & gửi khiếu nại</p>
          </div>
          <span class="text-emerald-600 font-bold">→</span>
        </button>

        <!-- Vai trò 3: Học sinh -->
        <button class="w-full flex items-center justify-between p-4 bg-sky-50 hover:bg-sky-100 border border-sky-200 rounded-xl transition">
          <div class="text-left">
            <p class="font-bold text-sky-700">Học Sinh</p>
            <p class="text-xs text-sky-600">Xem bảng xếp hạng thi đua 15 lớp</p>
          </div>
          <span class="text-sky-600 font-bold">→</span>
        </button>

        <!-- Vai trò 4: Admin / Bí thư Đoàn -->
        <button class="w-full flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100 border border-slate-300 rounded-xl transition">
          <div class="text-left">
            <p class="font-bold text-slate-800">Admin / Ban Thường Vụ Đoàn</p>
            <p class="text-xs text-slate-500">Duyệt khiếu nại & chốt điểm 1440đ</p>
          </div>
          <span class="text-slate-600 font-bold">→</span>
        </button>
      </div>
    </main>

    <!-- Phần 3: Chân trang (Footer) -->
    <footer class="p-4 text-center border-t border-slate-100 text-xs text-slate-400">
      Dự án KHKT 2026 • THPT Quang Trung - Đông Giang
    </footer>

  </div>

</body>
</html>
