<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Quản Lý Nề Nếp - THPT Quang Trung</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-200 text-slate-800 font-sans antialiased select-none">

  <div class="max-w-md mx-auto min-h-screen bg-slate-50 shadow-2xl flex flex-col justify-between relative overflow-hidden">
    
    <!-- HEADER -->
    <header class="bg-gradient-to-r from-blue-900 via-blue-800 to-blue-700 text-white p-4 rounded-b-2xl shadow-md z-10 flex items-center justify-between">
      <div>
        <p class="text-[10px] text-blue-200 uppercase font-bold tracking-widest">THPT Quang Trung • Đông Giang</p>
        <h1 class="text-base font-extrabold tracking-tight mt-0.5" id="header-title">Cổng Quản Lý Thi Đua</h1>
      </div>
      <div class="flex items-center gap-2">
        <span id="user-badge" class="hidden text-[11px] bg-blue-950/60 border border-blue-400/30 px-2.5 py-1 rounded-full font-semibold"></span>
        <button id="btn-logout" onclick="logout()" class="hidden bg-red-500 hover:bg-red-600 text-white text-xs px-2.5 py-1.5 rounded-lg font-medium transition shadow-sm">
          <i class="fas fa-power-off"></i> Đăng xuất
        </button>
      </div>
    </header>

    <!-- NỘI DUNG CHÍNH -->
    <main class="flex-1 p-4 overflow-y-auto pb-24">

      <!-- 1. MÀN HÌNH ĐĂNG NHẬP -->
      <section id="view-login" class="mt-6">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
          <div class="text-center mb-5">
            <div class="w-16 h-16 bg-blue-50 text-blue-700 rounded-2xl flex items-center justify-center mx-auto mb-3 text-3xl border border-blue-100 shadow-sm">
              <i class="fas fa-university"></i>
            </div>
            <h2 class="text-xl font-extrabold text-slate-800">Đăng Nhập Hệ Thống</h2>
            <p class="text-xs text-slate-500 mt-1">Chọn nhanh vai trò bên dưới để trải nghiệm ngay</p>
          </div>

          <!-- NÚT ĐĂNG NHẬP NHANH 1 CHẠM -->
          <div class="grid grid-cols-2 gap-2.5 mb-5">
            <button type="button" onclick="quickLogin('admin')" class="p-3 bg-purple-50 hover:bg-purple-100 border border-purple-200 text-purple-700 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 shadow-sm">
              <i class="fas fa-user-shield text-base"></i> Admin Đoàn
            </button>
            <button type="button" onclick="quickLogin('codo')" class="p-3 bg-red-50 hover:bg-red-100 border border-red-200 text-red-700 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 shadow-sm">
              <i class="fas fa-flag text-base"></i> Đội Cờ Đỏ
            </button>
            <button type="button" onclick="quickLogin('gvcn')" class="p-3 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-700 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 shadow-sm">
              <i class="fas fa-chalkboard-teacher text-base"></i> GVCN Lớp
            </button>
            <button type="button" onclick="quickLogin('hs')" class="p-3 bg-sky-50 hover:bg-sky-100 border border-sky-200 text-sky-700 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 shadow-sm">
              <i class="fas fa-trophy text-base"></i> Học Sinh
            </button>
          </div>

          <div class="relative flex py-2 items-center">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="flex-shrink mx-4 text-slate-400 text-[11px] font-semibold uppercase">Hoặc đăng nhập thủ công</span>
            <div class="flex-grow border-t border-slate-200"></div>
          </div>

          <form onsubmit="handleManualLogin(event)" class="space-y-3.5 text-sm mt-3">
            <div>
              <input type="text" id="login-user" placeholder="Tên đăng nhập (admin, codo, gvcn, hs)" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600 font-medium text-xs">
            </div>
            <div>
              <input type="password" id="login-pass" placeholder="Mật khẩu (123456 hoặc admin123)" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600 font-medium text-xs">
            </div>
            <button type="submit" class="w-full py-3 bg-blue-700 hover:bg-blue-800 text-white font-bold rounded-xl text-xs shadow-md transition">
              Đăng Nhập Tài Khoản <i class="fas fa-arrow-right ml-1"></i>
            </button>
          </form>
        </div>
      </section>

      <!-- 2. PHÂN HỆ ĐỘI CỜ ĐỎ -->
      <section id="view-codo" class="hidden space-y-4">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
          <h3 class="font-bold text-red-700 mb-3 flex items-center gap-2 text-sm uppercase">
            <i class="fas fa-pen-square text-base"></i> Ghi Nhận Vi Phạm Nề Nếp
          </h3>
          <div class="space-y-3.5 text-sm">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Chọn lớp vi phạm:</label>
              <select id="input-class" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-700 outline-none"></select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Học sinh / Tập thể:</label>
              <input type="text" id="input-student" placeholder="VD: Nguyễn Văn A" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Lỗi vi phạm & Trừ điểm:</label>
              <select id="input-rule" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                <option value="5|Đi học muộn sau 7h00">Đi học muộn sau 7h00 (-5 điểm)</option>
                <option value="10|Sai đồng phục / Thiếu bảng tên">Sai đồng phục / Thiếu bảng tên (-10 điểm)</option>
                <option value="15|Vệ sinh lớp bẩn / Đổ rác trễ">Vệ sinh lớp bẩn / Đổ rác trễ (-15 điểm)</option>
                <option value="30|Sử dụng điện thoại trái phép">Dùng điện thoại trong giờ (-30 điểm)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Ảnh minh chứng:</label>
              <label class="flex flex-col items-center justify-center w-full p-3 border-2 border-dashed border-slate-300 rounded-xl text-slate-500 hover:bg-slate-50 cursor-pointer">
                <i class="fas fa-camera text-blue-600 text-lg mb-1"></i>
                <span id="photo-label" class="text-xs font-medium">Chạm để chọn ảnh</span>
                <input type="file" id="input-photo" accept="image/*" class="hidden" onchange="previewPhoto(this)">
              </label>
              <img id="photo-preview" class="hidden mt-2 w-full h-32 object-cover rounded-xl border">
            </div>
            <button onclick="submitViolation()" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow-md transition">Gửi Phiếu & Trừ Điểm</button>
          </div>
        </div>
      </section>

      <!-- 3. PHÂN HỆ XẾP HẠNG -->
      <section id="view-hocsinh" class="hidden space-y-3">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-3.5 rounded-2xl shadow-sm flex items-center justify-between">
          <div>
            <p class="text-xs font-bold text-blue-100">Quỹ điểm chuẩn tuần</p>
            <p class="text-xl font-extrabold">1.440 Điểm</p>
          </div>
          <span class="text-xs bg-white/20 px-2.5 py-1 rounded-full font-medium">15 Lớp</span>
        </div>
        <div id="leaderboard-list" class="space-y-2.5"></div>
      </section>

      <!-- 4. PHÂN HỆ GVCN -->
      <section id="view-gvcn" class="hidden space-y-4">
        <div class="bg-white p-3.5 rounded-2xl shadow-sm border flex items-center justify-between">
          <span class="text-xs font-bold text-slate-700">Lớp chủ nhiệm:</span>
          <select id="gvcn-select-class" onchange="renderGvcnLogs()" class="p-2 bg-emerald-50 border border-emerald-200 text-emerald-800 font-extrabold text-sm rounded-xl outline-none"></select>
        </div>
        <div id="gvcn-logs-list" class="space-y-3"></div>
      </section>

      <!-- 5. PHÂN HỆ ADMIN -->
      <section id="view-admin" class="hidden space-y-4">
        <div class="grid grid-cols-2 gap-2.5">
          <div class="bg-white p-3 rounded-xl border shadow-sm">
            <p class="text-[11px] text-slate-500 font-semibold">Tổng lỗi vi phạm</p>
            <p class="text-xl font-extrabold text-slate-800 mt-0.5" id="stat-total-violations">0</p>
          </div>
          <div class="bg-white p-3 rounded-xl border shadow-sm">
            <p class="text-[11px] text-slate-500 font-semibold">Khiếu nại chờ duyệt</p>
            <p class="text-xl font-extrabold text-amber-600 mt-0.5" id="stat-pending-appeals">0</p>
          </div>
        </div>
        <div>
          <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 px-1">Đơn Khiếu Nại Chờ Xử Lý</h3>
          <div id="admin-appeals-list" class="space-y-3"></div>
        </div>
      </section>

    </main>

    <!-- BOTTOM NAV -->
    <nav id="bottom-nav" class="hidden fixed bottom-0 max-w-md w-full bg-white border-t border-slate-200 flex justify-around py-2.5 px-1 z-20 shadow-lg"></nav>

  </div>

  <script>
    const CLASSES = ['10/1', '10/2', '10/3', '10/4', '10/5', '11/1', '11/2', '11/3', '11/4', '11/5', '12/1', '12/2', '12/3', '12/4', '12/5'];
    const ACCOUNTS = {
      'codo':  { role: 'codo',    name: 'Đội Cờ Đỏ' },
      'gvcn':  { role: 'gvcn',    name: 'GVCN Lớp' },
      'admin': { role: 'admin',   name: 'Admin Đoàn' },
      'hs':    { role: 'hocsinh', name: 'Học Sinh' }
    };

    const STORAGE_KEY = 'thpt_quangtrung_nenep_v3';
    let currentPhotoBase64 = '';
    let currentUser = null;

    function loadViolations() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return JSON.parse(saved);
      const initial = [
        { id: 101, className: '10/2', student: 'Trần Minh Quân', rule: 'Đi học muộn sau 7h00', points: 5, time: 'Hôm nay', photo: '', status: 'normal', appealReason: '' },
        { id: 102, className: '11/3', student: 'Lê Thị Hoa', rule: 'Sai đồng phục / Thiếu bảng tên', points: 10, time: 'Hôm nay', photo: '', status: 'appealing', appealReason: 'Em bị rách áo trên đường đi học.' }
      ];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
      return initial;
    }

    let violations = loadViolations();

    function initSelects() {
      const inputClass = document.getElementById('input-class');
      const gvcnClass = document.getElementById('gvcn-select-class');
      CLASSES.forEach(c => {
        inputClass.innerHTML += `<option value="${c}">Lớp ${c}</option>`;
        gvcnClass.innerHTML += `<option value="${c}">Lớp ${c}</option>`;
      });
      gvcnClass.value = '11/3';
    }

    function quickLogin(userKey) {
      processLogin(userKey);
    }

    function handleManualLogin(e) {
      e.preventDefault();
      const user = document.getElementById('login-user').value.trim().toLowerCase();
      if (ACCOUNTS[user]) {
        processLogin(user);
      } else {
        alert('Tài khoản không đúng! Vui lòng dùng: admin, codo, gvcn, hs');
      }
    }

    function processLogin(userKey) {
      currentUser = ACCOUNTS[userKey];
      document.getElementById('user-badge').innerText = currentUser.name;
      document.getElementById('user-badge').classList.remove('hidden');
      document.getElementById('btn-logout').classList.remove('hidden');
      document.getElementById('view-login').classList.add('hidden');
      document.getElementById('bottom-nav').classList.remove('hidden');
      
      setupNavigation(currentUser.role);
      openTab(currentUser.role === 'admin' ? 'admin' : (currentUser.role === 'codo' ? 'codo' : (currentUser.role === 'gvcn' ? 'gvcn' : 'hocsinh')));
    }

    function setupNavigation(role) {
      const nav = document.getElementById('bottom-nav');
      let buttons = `<button onclick="openTab('hocsinh')" class="flex flex-col items-center text-slate-600 hover:text-blue-700 text-[11px] font-bold"><i class="fas fa-trophy text-base mb-0.5"></i> Xếp Hạng</button>`;

      if (role === 'codo') {
        buttons += `<button onclick="openTab('codo')" class="flex flex-col items-center text-red-600 text-[11px] font-bold"><i class="fas fa-flag text-base mb-0.5"></i> Ghi Lỗi</button>`;
      } else if (role === 'gvcn') {
        buttons += `<button onclick="openTab('gvcn')" class="flex flex-col items-center text-emerald-600 text-[11px] font-bold"><i class="fas fa-clipboard-list text-base mb-0.5"></i> Khiếu Nại</button>`;
      } else if (role === 'admin') {
        buttons += `<button onclick="openTab('admin')" class="flex flex-col items-center text-purple-600 text-[11px] font-bold"><i class="fas fa-user-shield text-base mb-0.5"></i> Duyệt Lỗi</button>`;
      }
      nav.innerHTML = buttons;
    }

    function openTab(tabName) {
      ['codo', 'hocsinh', 'gvcn', 'admin'].forEach(v => document.getElementById('view-' + v).classList.add('hidden'));
      document.getElementById('view-' + tabName).classList.remove('hidden');

      if (tabName === 'hocsinh') renderLeaderboard();
      if (tabName === 'gvcn') renderGvcnLogs();
      if (tabName === 'admin') renderAdminPanel();
    }

    function logout() {
      currentUser = null;
      ['codo', 'hocsinh', 'gvcn', 'admin'].forEach(v => document.getElementById('view-' + v).classList.add('hidden'));
      document.getElementById('view-login').classList.remove('hidden');
      document.getElementById('btn-logout').classList.add('hidden');
      document.getElementById('user-badge').classList.add('hidden');
      document.getElementById('bottom-nav').classList.add('hidden');
      document.getElementById('header-title').innerText = 'Cổng Quản Lý Thi Đua';
    }

    function previewPhoto(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentPhotoBase64 = e.target.result;
          const preview = document.getElementById('photo-preview');
          preview.src = currentPhotoBase64;
          preview.classList.remove('hidden');
          document.getElementById('photo-label').innerText = 'Đã chọn ảnh thành công';
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function submitViolation() {
      const className = document.getElementById('input-class').value;
      const student = document.getElementById('input-student').value.trim() || 'Học sinh vi phạm';
      const ruleVal = document.getElementById('input-rule').value.split('|');

      violations.unshift({
        id: Date.now(),
        className: className,
        student: student,
        rule: ruleVal[1],
        points: parseInt(ruleVal[0]),
        time: 'Hôm nay',
        photo: currentPhotoBase64,
        status: 'normal',
        appealReason: ''
      });

      localStorage.setItem(STORAGE_KEY, JSON.stringify(violations));
      document.getElementById('input-student').value = '';
      currentPhotoBase64 = '';
      document.getElementById('photo-preview').classList.add('hidden');
      document.getElementById('photo-label').innerText = 'Chạm để chọn ảnh';
      
      alert(`Đã ghi nhận lỗi lớp ${className} (-${ruleVal[0]}đ)!`);
      openTab('hocsinh');
    }

    function renderLeaderboard() {
      const scores = CLASSES.map(c => {
        const deducted = violations.filter(v => v.className === c && v.status !== 'approved').reduce((sum, v) => sum + v.points, 0);
        return { className: c, score: 1440 - deducted, deducted };
      }).sort((a, b) => b.score - a.score);

      const container = document.getElementById('leaderboard-list');
      container.innerHTML = '';
      scores.forEach((item, index) => {
        container.innerHTML += `
          <div class="bg-white p-3.5 rounded-xl shadow-sm border flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="w-7 h-7 rounded-full bg-slate-100 font-bold text-xs flex items-center justify-center">${index + 1}</span>
              <div>
                <p class="font-bold text-slate-800 text-sm">Lớp ${item.className}</p>
                <p class="text-[11px] text-slate-400">${item.deducted > 0 ? 'Trừ ' + item.deducted + ' điểm' : 'Bảo toàn tuyệt đối'}</p>
              </div>
            </div>
            <div class="text-right">
              <p class="font-extrabold text-blue-700 text-base">${item.score}đ</p>
            </div>
          </div>
        `;
      });
    }

    function renderGvcnLogs() {
      const selectedClass = document.getElementById('gvcn-select-class').value;
      const list = violations.filter(v => v.className === selectedClass);
      const container = document.getElementById('gvcn-logs-list');
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = `<div class="text-center p-6 bg-white rounded-xl text-slate-400 text-xs">Lớp ${selectedClass} không có vi phạm.</div>`;
        return;
      }

      list.forEach(v => {
        let action = v.status === 'normal' ? 
          `<button onclick="sendAppeal(${v.id})" class="mt-2 w-full py-2 bg-amber-50 text-amber-800 rounded-xl text-xs font-bold border border-amber-200">Gửi Khiếu Nại</button>` :
          (v.status === 'appealing' ? `<div class="mt-2 p-2 bg-amber-50 text-xs text-amber-800 rounded">Đang chờ Đoàn trường duyệt</div>` : `<div class="mt-2 p-2 bg-emerald-50 text-xs text-emerald-700 font-bold rounded">Đã hoàn điểm</div>`);

        container.innerHTML += `
          <div class="bg-white p-4 rounded-xl shadow-sm border">
            <p class="font-bold text-sm text-slate-800">${v.rule} (-${v.points}đ)</p>
            <p class="text-xs text-slate-500">Đối tượng: ${v.student}</p>
            ${action}
          </div>
        `;
      });
    }

    function sendAppeal(id) {
      const reason = prompt('Nhập lý do khiếu nại:');
      if (reason && reason.trim()) {
        const item = violations.find(v => v.id === id);
        item.status = 'appealing';
        item.appealReason = reason.trim();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(violations));
        renderGvcnLogs();
        alert('Đã gửi khiếu nại thành công!');
      }
    }

    function renderAdminPanel() {
      const appeals = violations.filter(v => v.status === 'appealing');
      document.getElementById('stat-total-violations').innerText = violations.filter(v => v.status !== 'approved').length;
      document.getElementById('stat-pending-appeals').innerText = appeals.length;

      const container = document.getElementById('admin-appeals-list');
      container.innerHTML = '';

      if (appeals.length === 0) {
        container.innerHTML = `<div class="text-center p-6 bg-white rounded-xl text-slate-400 text-xs">Không có đơn khiếu nại nào.</div>`;
        return;
      }

      appeals.forEach(v => {
        container.innerHTML += `
          <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-purple-600">
            <p class="font-bold text-sm">Lớp ${v.className} - ${v.rule} (-${v.points}đ)</p>
            <p class="text-xs text-slate-600 mt-1">Lý do GVCN: "${v.appealReason}"</p>
            <div class="grid grid-cols-2 gap-2 mt-3">
              <button onclick="resolveAppeal(${v.id}, true)" class="py-2 bg-emerald-600 text-white font-bold rounded-lg text-xs">Chấp nhận (Hoàn điểm)</b
