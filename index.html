<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Nề Nếp - THPT Quang Trung</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-200 text-slate-800 font-sans antialiased select-none">

  <!-- Khung chuẩn Mobile-First -->
  <div class="max-w-md mx-auto min-h-screen bg-slate-50 shadow-2xl flex flex-col justify-between relative overflow-hidden">
    
    <!-- HEADER CHUNG -->
    <header class="bg-gradient-to-r from-blue-800 to-blue-600 text-white p-4 rounded-b-2xl shadow-md z-10">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-[11px] text-blue-200 uppercase font-bold tracking-wider">THPT Quang Trung • Đông Giang</p>
          <h1 class="text-lg font-extrabold tracking-tight" id="header-title">Hệ Thống Quản Lý Thi Đua</h1>
        </div>
        <button id="btn-logout" onclick="switchRole('login')" class="hidden bg-white/20 hover:bg-white/30 text-white text-xs px-3 py-1.5 rounded-lg font-medium backdrop-blur-sm transition">
          <i class="fas fa-sign-out-alt mr-1"></i> Đổi vai trò
        </button>
        <span id="badge-year" class="bg-blue-900/50 text-xs px-2.5 py-1 rounded-full border border-blue-400/50 font-medium">
          2026 - 2027
        </span>
      </div>
    </header>

    <!-- KHU VỰC NỘI DUNG ĐỘNG -->
    <main class="flex-1 p-4 overflow-y-auto pb-20">

      <!-- 1. MÀN HÌNH ĐĂNG NHẬP (CHỌN 4 VAI TRÒ) -->
      <section id="view-login" class="space-y-4 mt-2">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 text-center">
          <div class="w-12 h-12 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center mx-auto mb-2 text-xl font-bold">
            <i class="fas fa-school"></i>
          </div>
          <h2 class="text-lg font-bold text-slate-800">Cổng Thông Tin Nề Nếp</h2>
          <p class="text-xs text-slate-500 mt-1">Chọn phân quyền truy cập để trải nghiệm hệ thống</p>
        </div>

        <div class="space-y-3">
          <button onclick="switchRole('codo')" class="w-full flex items-center justify-between p-4 bg-white hover:bg-red-50 border-l-4 border-red-600 rounded-xl shadow-sm transition group">
            <div class="flex items-center gap-3.5 text-left">
              <div class="w-10 h-10 rounded-lg bg-red-100 text-red-600 flex items-center justify-center text-lg">
                <i class="fas fa-flag"></i>
              </div>
              <div>
                <p class="font-bold text-slate-800 group-hover:text-red-700">Đội Cờ Đỏ / Xung Kích</p>
                <p class="text-xs text-slate-500">Chấm điểm, ghi lỗi & đính kèm minh chứng</p>
              </div>
            </div>
            <i class="fas fa-chevron-right text-slate-400 group-hover:text-red-600"></i>
          </button>

          <button onclick="switchRole('gvcn')" class="w-full flex items-center justify-between p-4 bg-white hover:bg-emerald-50 border-l-4 border-emerald-600 rounded-xl shadow-sm transition group">
            <div class="flex items-center gap-3.5 text-left">
              <div class="w-10 h-10 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg">
                <i class="fas fa-chalkboard-teacher"></i>
              </div>
              <div>
                <p class="font-bold text-slate-800 group-hover:text-emerald-700">Giáo Viên Chủ Nhiệm</p>
                <p class="text-xs text-slate-500">Theo dõi chi tiết lớp & gửi khiếu nại</p>
              </div>
            </div>
            <i class="fas fa-chevron-right text-slate-400 group-hover:text-emerald-600"></i>
          </button>

          <button onclick="switchRole('hocsinh')" class="w-full flex items-center justify-between p-4 bg-white hover:bg-sky-50 border-l-4 border-sky-600 rounded-xl shadow-sm transition group">
            <div class="flex items-center gap-3.5 text-left">
              <div class="w-10 h-10 rounded-lg bg-sky-100 text-sky-600 flex items-center justify-center text-lg">
                <i class="fas fa-trophy"></i>
              </div>
              <div>
                <p class="font-bold text-slate-800 group-hover:text-sky-700">Học Sinh Toàn Trường</p>
                <p class="text-xs text-slate-500">Bảng xếp hạng thi đua 15 lớp (Mốc 1440đ)</p>
              </div>
            </div>
            <i class="fas fa-chevron-right text-slate-400 group-hover:text-sky-600"></i>
          </button>

          <button onclick="switchRole('admin')" class="w-full flex items-center justify-between p-4 bg-white hover:bg-purple-50 border-l-4 border-purple-600 rounded-xl shadow-sm transition group">
            <div class="flex items-center gap-3.5 text-left">
              <div class="w-10 h-10 rounded-lg bg-purple-100 text-purple-600 flex items-center justify-center text-lg">
                <i class="fas fa-user-shield"></i>
              </div>
              <div>
                <p class="font-bold text-slate-800 group-hover:text-purple-700">Admin / Ban Thường Vụ Đoàn</p>
                <p class="text-xs text-slate-500">Duyệt khiếu nại & quản trị dữ liệu gốc</p>
              </div>
            </div>
            <i class="fas fa-chevron-right text-slate-400 group-hover:text-purple-600"></i>
          </button>
        </div>
      </section>

      <!-- 2. GIAO DIỆN ĐỘI CỜ ĐỎ (NHẬP VI PHẠM) -->
      <section id="view-codo" class="hidden space-y-4">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
          <h3 class="font-bold text-red-700 mb-3 flex items-center gap-2">
            <i class="fas fa-edit"></i> Phiếu Ghi Nhận Vi Phạm Nề Nếp
          </h3>
          
          <div class="space-y-3 text-sm">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Chọn lớp vi phạm:</label>
              <select id="input-class" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 font-medium"></select>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Họ tên học sinh (hoặc tập thể):</label>
              <input type="text" id="input-student" placeholder="VD: Nguyễn Văn A (hoặc Cả lớp)" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Lỗi vi phạm & Điểm trừ:</label>
              <select id="input-rule" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                <option value="5|Đi học muộn sau 7h00">Đi học muộn sau 7h00 (-5 điểm)</option>
                <option value="10|Không mặc đồng phục / Không đeo bảng tên">Sai đồng phục / Thiếu bảng tên (-10 điểm)</option>
                <option value="15|Trực nhật bẩn / Đổ rác trễ">Vệ sinh lớp bẩn / Đổ rác trễ (-15 điểm)</option>
                <option value="20|Nói chuyện riêng / Mất trật tự giờ học">Mất trật tự trong
