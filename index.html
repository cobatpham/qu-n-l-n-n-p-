<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOP DELTA FORCE VN - Hệ Thống Bán Acc Tự Động</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-slate-950">

  <!-- THANH ĐIỀU HƯỚNG (NAVBAR) -->
  <nav class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 shadow-lg">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <!-- Logo -->
      <div onclick="switchPage('home')" class="flex items-center gap-2.5 cursor-pointer">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-cyan-600 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-emerald-500/20">
          <i class="fas fa-crosshairs"></i>
        </div>
        <div>
          <span class="font-black text-lg tracking-tight text-white">DELTA<span class="text-emerald-400">SHOP</span></span>
          <p class="text-[10px] text-slate-400 font-semibold uppercase tracking-widest -mt-1">Garena VN • Tự Động 24/7</p>
        </div>
      </div>

      <!-- Menu PC -->
      <div class="hidden md:flex items-center gap-6 text-sm font-bold text-slate-300">
        <button onclick="switchPage('home')" class="hover:text-emerald-400 transition">Trang Chủ</button>
        <button onclick="switchPage('topup')" class="hover:text-emerald-400 transition">Nạp Tiền</button>
        <button onclick="switchPage('history')" class="hover:text-emerald-400 transition">Lịch Sử Mua</button>
        <button id="nav-admin-pc" onclick="switchPage('admin')" class="hidden text-amber-400 hover:text-amber-300 transition"><i class="fas fa-crown mr-1"></i> Quản Trị</button>
      </div>

      <!-- Khu vực Tài khoản -->
      <div id="auth-guest" class="flex items-center gap-2">
        <button onclick="openAuthModal('login')" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold transition border border-slate-700">Đăng Nhập</button>
        <button onclick="openAuthModal('register')" class="px-3.5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-black transition shadow-md shadow-emerald-500/20">Đăng Ký</button>
      </div>

      <div id="auth-user" class="hidden flex items-center gap-3">
        <div onclick="switchPage('topup')" class="cursor-pointer bg-slate-800/90 border border-emerald-500/30 px-3 py-1.5 rounded-xl flex items-center gap-2 hover:bg-slate-800 transition">
          <i class="fas fa-wallet text-emerald-400 text-xs"></i>
          <span id="user-balance" class="text-xs font-black text-emerald-400">0đ</span>
          <span class="w-4 h-4 rounded-full bg-emerald-500 text-slate-950 flex items-center justify-center text-[10px] font-black">+</span>
        </div>
        <div class="relative group">
          <button class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700 text-xs font-bold">
            <i class="fas fa-user-circle text-slate-400 text-base"></i>
            <span id="user-name" class="max-w-[80px] truncate">User</span>
          </button>
          <div class="hidden group-hover:block absolute right-0 mt-1 w-44 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl py-1.5 text-xs font-semibold
